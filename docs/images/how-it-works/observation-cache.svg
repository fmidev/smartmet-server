<svg xmlns="http://www.w3.org/2000/svg" width="980" height="375" viewBox="0 0 980 375" role="img" aria-label="How the observation engine answers requests">
<title>How the observation engine answers requests</title>

<style>
  text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1e293b; }
  .t { font-size: 15px; font-weight: 600; }
  .s { font-size: 12.5px; fill: #475569; }
  .m { font-size: 12px; fill: #334155; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
  .h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
  .g { font-size: 14px; font-weight: 700; fill: #334155; }
  .l { font-size: 12px; fill: #475569; font-style: italic; }
  .ln { stroke: #475569; stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 6 4; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>

<rect width="980" height="375" rx="12" fill="#ffffff"/>
<rect x="20" y="40" width="190" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="115.0" y="71.0" class="t" text-anchor="middle">PostgreSQL replica</text>
<text x="115.0" y="90.0" class="s" text-anchor="middle">recent data</text>
<rect x="20" y="250" width="190" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="115.0" y="281.0" class="t" text-anchor="middle">PostgreSQL master</text>
<text x="115.0" y="300.0" class="s" text-anchor="middle">older data, archive</text>
<rect x="270" y="40" width="200" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="370.0" y="63.0" class="t" text-anchor="middle">Cache update threads</text>
<text x="370.0" y="82.0" class="s" text-anchor="middle">one per data kind,</text>
<text x="370.0" y="98.0" class="s" text-anchor="middle">every few s – min</text>
<polyline points="210,75 268,75" class="ln" marker-end="url(#arrow)"/>
<rect x="530" y="20" width="210" height="140" rx="12" fill="#fff7fb" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="545" y="35" width="180" height="52" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="635.0" y="57.0" class="t" text-anchor="middle">Disk cache</text>
<text x="635.0" y="76.0" class="s" text-anchor="middle">recent days</text>
<rect x="545" y="97" width="180" height="52" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="635.0" y="119.0" class="t" text-anchor="middle">Memory cache</text>
<text x="635.0" y="138.0" class="s" text-anchor="middle">recent hours</text>
<polyline points="470,75 528,75" class="ln" marker-end="url(#arrow)"/>
<rect x="800" y="200" width="160" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="880.0" y="223.0" class="t" text-anchor="middle">Request</text>
<text x="880.0" y="242.0" class="s" text-anchor="middle">TA at Kumpula,</text>
<text x="880.0" y="258.0" class="s" text-anchor="middle">last 24 hours</text>
<polygon points="635,185 730,235 635,285 540,235" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="635" y="231" class="t" text-anchor="middle">whole period</text>
<text x="635" y="248" class="t" text-anchor="middle">in cache?</text>
<polyline points="800,235 732,235" class="ln" marker-end="url(#arrow)"/>
<polyline points="635,185 635,162" class="ln" marker-end="url(#arrow)"/>
<rect x="647.0" y="166" width="28.0" height="16" rx="3" fill="#ffffff"/>
<text x="652" y="178" class="l" text-anchor="start">yes</text>
<polyline points="540,235 500,235" class="ln"/>
<rect x="509.0" y="216" width="22.0" height="16" rx="3" fill="#ffffff"/>
<text x="520" y="228" class="l" text-anchor="middle">no</text>
<polyline points="500,235 500,285 212,285" class="ln" marker-end="url(#arrow)"/>
<rect x="297.0" y="267" width="118.0" height="16" rx="3" fill="#ffffff"/>
<text x="356" y="279" class="l" text-anchor="middle">older data: master</text>
<polyline points="500,235 500,180 115,180 115,112" class="ln" marker-end="url(#arrow)"/>
<rect x="235.0" y="162" width="130.0" height="16" rx="3" fill="#ffffff"/>
<text x="300" y="174" class="l" text-anchor="middle">recent data: replica</text>
<text x="356" y="340" class="s" text-anchor="middle">a request that starts further back than the cache goes to a database,</text>
<text x="356" y="357" class="s" text-anchor="middle">chosen by how far back the request reaches</text>
</svg>
