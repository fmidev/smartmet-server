<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-label="How a QueryData file becomes available">
<title>How a QueryData file becomes available</title>

<style>
  text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1e293b; }
  .t { font-size: 15px; font-weight: 600; }
  .s { font-size: 12.5px; fill: #475569; }
  .m { font-size: 12px; fill: #334155; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
  .h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
  .g { font-size: 14px; font-weight: 700; fill: #334155; }
  .l { font-size: 12px; fill: #475569; font-style: italic; }
  .ln { stroke: #475569; stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 6 4; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>

<rect width="980" height="250" rx="12" fill="#ffffff"/>
<rect x="15" y="20" width="380" height="205" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="31" y="42" class="g" text-anchor="start">Data producer (rsync)</text>
<rect x="415" y="20" width="550" height="205" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="431" y="42" class="g" text-anchor="start">querydata engine (each backend)</text>
<rect x="30" y="70" width="160" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="110.0" y="110.0" class="t" text-anchor="middle">rsync transfers</text>
<text x="110.0" y="129.0" class="s" text-anchor="middle">.202611251200_pal…</text>
<text x="110.0" y="145.0" class="s" text-anchor="middle">.sqd.Xk3a9Q</text>
<text x="110.0" y="161.0" class="s" text-anchor="middle">hidden: ignored</text>
<rect x="215" y="70" width="160" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="295.0" y="110.0" class="t" text-anchor="middle">rename</text>
<text x="295.0" y="129.0" class="s" text-anchor="middle">202611251200_pal…</text>
<text x="295.0" y="145.0" class="s" text-anchor="middle">_pinta.sqd</text>
<text x="295.0" y="161.0" class="s" text-anchor="middle">complete file</text>
<rect x="430" y="70" width="160" height="120" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="510.0" y="110.0" class="t" text-anchor="middle">notice</text>
<text x="510.0" y="129.0" class="s" text-anchor="middle">directory rescan,</text>
<text x="510.0" y="145.0" class="s" text-anchor="middle">at most 60 s</text>
<text x="510.0" y="161.0" class="s" text-anchor="middle">(refresh_interval)</text>
<rect x="610" y="70" width="160" height="120" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="690.0" y="110.0" class="t" text-anchor="middle">map and index</text>
<text x="690.0" y="129.0" class="s" text-anchor="middle">by producer and</text>
<text x="690.0" y="145.0" class="s" text-anchor="middle">origin time;</text>
<text x="690.0" y="161.0" class="s" text-anchor="middle">now in what=qengine</text>
<rect x="790" y="70" width="160" height="120" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="870.0" y="110.0" class="t" text-anchor="middle">drop old runs</text>
<text x="870.0" y="129.0" class="s" text-anchor="middle">keep the newest</text>
<text x="870.0" y="145.0" class="s" text-anchor="middle">number_to_keep</text>
<text x="870.0" y="161.0" class="s" text-anchor="middle">runs (default 2)</text>
<polyline points="190,130 213,130" class="ln" marker-end="url(#arrow)"/>
<polyline points="375,130 428,130" class="ln" marker-end="url(#arrow)"/>
<polyline points="590,130 608,130" class="ln" marker-end="url(#arrow)"/>
<polyline points="770,130 788,130" class="ln" marker-end="url(#arrow)"/>
</svg>
