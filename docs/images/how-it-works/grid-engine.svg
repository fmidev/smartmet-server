<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="410" viewBox="0 0 1035 410" role="img" aria-label="How the grid engine finds and reads data">
<title>How the grid engine finds and reads data</title>

<style>
  text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1e293b; }
  .t { font-size: 15px; font-weight: 600; }
  .s { font-size: 12.5px; fill: #475569; }
  .m { font-size: 12px; fill: #334155; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
  .h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
  .g { font-size: 14px; font-weight: 700; fill: #334155; }
  .l { font-size: 12px; fill: #475569; font-style: italic; }
  .ln { stroke: #475569; stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 6 4; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>

<rect width="1035" height="410" rx="12" fill="#ffffff"/>
<rect x="20" y="60" width="200" height="150" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="120.0" y="99.0" class="t" text-anchor="middle">Model output on NFS</text>
<text x="120.0" y="118.0" class="m" text-anchor="middle"></text>
<text x="120.0" y="134.0" class="m" text-anchor="middle">…/MEPS/20261125T12/</text>
<text x="120.0" y="150.0" class="m" text-anchor="middle">*.grib2</text>
<text x="120.0" y="166.0" class="m" text-anchor="middle">…/ECMWF/…/*.grib</text>
<text x="120.0" y="182.0" class="m" text-anchor="middle">…/*.nc</text>
<rect x="260" y="60" width="180" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="350.0" y="107.0" class="t" text-anchor="middle">Registration tools</text>
<text x="350.0" y="126.0" class="s" text-anchor="middle"></text>
<text x="350.0" y="142.0" class="s" text-anchor="middle">filesys2smartmet</text>
<text x="350.0" y="158.0" class="s" text-anchor="middle">radon2smartmet</text>
<text x="350.0" y="174.0" class="s" text-anchor="middle">(separate daemons)</text>
<polyline points="220,135 258,135" class="ln" marker-end="url(#arrow)"/>
<rect x="222.0" y="115" width="34.0" height="16" rx="3" fill="#ffffff"/>
<text x="239" y="127" class="l" text-anchor="middle">scan</text>
<rect x="480" y="40" width="200" height="200" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="580" y="66" class="t" text-anchor="middle">Content index (Redis)</text>
<text x="500" y="100" class="m" text-anchor="start">producers</text>
<text x="664" y="100" class="s" text-anchor="end">54</text>
<polyline points="504,110 504,128 514,128" class="ln"/>
<text x="520" y="132" class="m" text-anchor="start">generations</text>
<text x="664" y="132" class="s" text-anchor="end">~340</text>
<polyline points="520,142 520,160 530,160" class="ln"/>
<text x="536" y="164" class="m" text-anchor="start">files</text>
<text x="664" y="164" class="s" text-anchor="end">~470 000</text>
<polyline points="536,174 536,192 546,192" class="ln"/>
<text x="552" y="196" class="m" text-anchor="start">contents</text>
<text x="664" y="196" class="s" text-anchor="end">~14.5 M</text>
<text x="580" y="228" class="s" text-anchor="middle">FMI production counts</text>
<polyline points="440,135 478,135" class="ln" marker-end="url(#arrow)"/>
<rect x="430.0" y="115" width="58.0" height="16" rx="3" fill="#ffffff"/>
<text x="459" y="127" class="l" text-anchor="middle">register</text>
<rect x="700" y="20" width="320" height="310" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="716" y="42" class="g" text-anchor="start">Grid engine (each backend)</text>
<rect x="715" y="50" width="290" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="860.0" y="68.0" class="t" text-anchor="middle">Plugins</text>
<text x="860.0" y="87.0" class="s" text-anchor="middle">timeseries, wms, edr, download…</text>
<rect x="715" y="120" width="290" height="62" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="860.0" y="147.0" class="t" text-anchor="middle">Query Server</text>
<text x="860.0" y="166.0" class="s" text-anchor="middle">names, mappings, interpolation, Lua</text>
<rect x="715" y="210" width="140" height="100" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="785.0" y="248.0" class="t" text-anchor="middle">Content Server</text>
<text x="785.0" y="267.0" class="s" text-anchor="middle">in-memory copy</text>
<text x="785.0" y="283.0" class="s" text-anchor="middle">of the index</text>
<rect x="865" y="210" width="140" height="100" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="935.0" y="240.0" class="t" text-anchor="middle">Data Server</text>
<text x="935.0" y="259.0" class="s" text-anchor="middle">reads files,</text>
<text x="935.0" y="275.0" class="s" text-anchor="middle">decompression</text>
<text x="935.0" y="291.0" class="s" text-anchor="middle">cache</text>
<polyline points="860,94 860,118" class="ln" marker-end="url(#arrow)"/>
<polyline points="810,182 785,208" class="ln" marker-end="url(#arrow)"/>
<polyline points="910,182 935,208" class="ln" marker-end="url(#arrow)"/>
<polyline points="680,225 713,225" class="ln" marker-end="url(#arrow)"/>
<rect x="674.0" y="204" width="46.0" height="16" rx="3" fill="#ffffff"/>
<text x="697" y="216" class="l" text-anchor="middle">events</text>
<polyline points="120,210 120,372 935,372 935,312" class="ln" marker-end="url(#arrow)"/>
<rect x="407.0" y="354" width="226.0" height="16" rx="3" fill="#ffffff"/>
<text x="520" y="366" class="l" text-anchor="middle">values read in place (memory-mapped)</text>
</svg>
